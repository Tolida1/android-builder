name: Build Android App

on:
  workflow_dispatch:
    inputs:
      owner_id:           { description: 'Firebase User ID',       required: true }
      app_id:             { description: 'App ID',                 required: true }
      app_name:           { description: 'App Name',               required: true }
      package_name:       { description: 'Package Name',           required: true }
      version_code:       { description: 'Version Code',           required: true,  default: '1' }
      version_name:       { description: 'Version Name',           required: true,  default: '1.0' }
      primary_color:      { description: 'Primary Color',          required: false, default: '#6c63ff' }
      primary_dark_color: { description: 'Dark Color',             required: false, default: '#1a1a2e' }
      accent_color:       { description: 'Accent Color',           required: false, default: '#ff6584' }
      content_url:        { description: 'Content URL',            required: false, default: 'https://example.com' }
      icon_url:           { description: 'Icon URL',               required: false, default: '' }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'build-tools;34.0.0 platforms;android-34'

      - name: Build APK
        env:
          OWNER_ID:             ${{ github.event.inputs.owner_id }}
          APP_ID:               ${{ github.event.inputs.app_id }}
          APP_NAME:             ${{ github.event.inputs.app_name }}
          PACKAGE_NAME:         ${{ github.event.inputs.package_name }}
          VERSION_CODE:         ${{ github.event.inputs.version_code }}
          VERSION_NAME:         ${{ github.event.inputs.version_name }}
          PRIMARY_COLOR:        ${{ github.event.inputs.primary_color }}
          PRIMARY_DARK_COLOR:   ${{ github.event.inputs.primary_dark_color }}
          ACCENT_COLOR:         ${{ github.event.inputs.accent_color }}
          CONTENT_URL:          ${{ github.event.inputs.content_url }}
          ICON_URL:             ${{ github.event.inputs.icon_url }}
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: chmod +x build_app.sh && bash build_app.sh

      - name: Upload to Firebase Storage
        if: success()
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SA_KEY:  ${{ secrets.FIREBASE_SA_KEY }}
          OWNER_ID:         ${{ github.event.inputs.owner_id }}
          APP_ID:           ${{ github.event.inputs.app_id }}
          PACKAGE_NAME:     ${{ github.event.inputs.package_name }}
          VERSION_CODE:     ${{ github.event.inputs.version_code }}
        run: |
          echo "$FIREBASE_SA_KEY" > /tmp/sa.json
          pip install google-auth --quiet
          echo "" | base64 -d > /tmp/get_token.py
          TOKEN=$(python3 /tmp/get_token.py /tmp/sa.json)
          APK="/tmp/${PACKAGE_NAME}_v${VERSION_CODE}.apk"
          AAB="/tmp/${PACKAGE_NAME}_v${VERSION_CODE}.aab"
          BUCKET="${FIREBASE_PROJECT}.firebasestorage.app"
          BASE="builds/${OWNER_ID}/${APP_ID}/v${VERSION_CODE}"
          ENC_APK=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${BASE}/app.apk")
          ENC_AAB=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "${BASE}/app.aab")
          curl -s -X POST "https://storage.googleapis.com/upload/storage/v1/b/${BUCKET}/o?uploadType=media&name=${ENC_APK}" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/vnd.android.package-archive" --data-binary @"$APK"
          if [ -f "$AAB" ]; then
            curl -s -X POST "https://storage.googleapis.com/upload/storage/v1/b/${BUCKET}/o?uploadType=media&name=${ENC_AAB}" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/octet-stream" --data-binary @"$AAB"
          fi
          echo "TOKEN=${TOKEN}"       >> $GITHUB_ENV
          echo "BUCKET=${BUCKET}"     >> $GITHUB_ENV
          echo "ENC_APK=${ENC_APK}"   >> $GITHUB_ENV
          echo "ENC_AAB=${ENC_AAB}"   >> $GITHUB_ENV

      - name: Firestore Update Success
        if: success()
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          OWNER_ID:         ${{ github.event.inputs.owner_id }}
          APP_ID:           ${{ github.event.inputs.app_id }}
          VERSION_CODE:     ${{ github.event.inputs.version_code }}
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          APK_URL="https://firebasestorage.googleapis.com/v0/b/${BUCKET}/o/${ENC_APK}?alt=media"
          AAB_URL="https://firebasestorage.googleapis.com/v0/b/${BUCKET}/o/${ENC_AAB}?alt=media"
          curl -s -X PATCH "https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents/apps/${OWNER_ID}/list/${APP_ID}?updateMask.fieldPaths=buildStatus&updateMask.fieldPaths=apkUrl&updateMask.fieldPaths=aabUrl&updateMask.fieldPaths=builtAt&updateMask.fieldPaths=versionCode" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" -d "{\"fields\":{\"buildStatus\":{\"stringValue\":\"ready\"},\"apkUrl\":{\"stringValue\":\"${APK_URL}\"},\"aabUrl\":{\"stringValue\":\"${AAB_URL}\"},\"builtAt\":{\"timestampValue\":\"${NOW}\"},\"versionCode\":{\"integerValue\":\"${VERSION_CODE}\"}}}"
          echo "Firestore: ready"

      - name: Firestore Update Failed
        if: failure()
        env:
          FIREBASE_PROJECT: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_SA_KEY:  ${{ secrets.FIREBASE_SA_KEY }}
          OWNER_ID:         ${{ github.event.inputs.owner_id }}
          APP_ID:           ${{ github.event.inputs.app_id }}
        run: |
          echo "$FIREBASE_SA_KEY" > /tmp/sa.json
          pip install google-auth --quiet
          echo "" | base64 -d > /tmp/get_token_fail.py
          TOKEN=$(python3 /tmp/get_token_fail.py /tmp/sa.json)
          curl -s -X PATCH "https://firestore.googleapis.com/v1/projects/${FIREBASE_PROJECT}/databases/(default)/documents/apps/${OWNER_ID}/list/${APP_ID}?updateMask.fieldPaths=buildStatus" -H "Authorization: Bearer ${TOKEN}" -H "Content-Type: application/json" -d '{"fields":{"buildStatus":{"stringValue":"failed"}}}'
